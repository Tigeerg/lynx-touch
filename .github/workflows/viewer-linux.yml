# viewer-linux.yml - run of the 3D g-code viewer on Linux: C++ build (scripts/build-viewer.sh),
# smoke and full offscreen run of the reference g-code. The Linux path has not been run for long (README,
# "Building and running the viewer (C++)"), and this workflow keeps it alive.
#
# The ru_RU.UTF-8 locale is generated and set on purpose: g-code number parsing once
# depended on LC_NUMERIC, and under ru_RU the toolpath of Test_model.ngc broke off at 785
# segments out of 70914 (viewer log 0.41.1). A run under ru_RU guards against a repeat.
#
# Oracle comparison probes (gcode_probe --manifest and others) are NOT run here:
# it is bit-for-bit comparison, and on Linux against the Windows reference 2 records out of 31 differ by
# 1 ULP due to different libm (viewer log 0.41.3, measurement). Their place is the
# development machine and the pnpm guard.
name: viewer-linux

on:
  push:
    paths:
      - 'modules/gcode-viewer/**'
      - 'data/cad-testdata/**'
      - 'scripts/build-viewer.sh'
      - 'scripts/build-viewer.ps1'
      - 'environment.yml'
      - '.github/workflows/viewer-linux.yml'
  pull_request:
    paths:
      - 'modules/gcode-viewer/**'
      - 'data/cad-testdata/**'
      - 'scripts/build-viewer.sh'
      - 'scripts/build-viewer.ps1'
      - 'environment.yml'
      - '.github/workflows/viewer-linux.yml'

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Локаль ru_RU.UTF-8
        shell: bash -el {0}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq locales
          sudo locale-gen ru_RU.UTF-8

      - name: Сборка вьювера
        shell: bash -el {0}
        run: |
          CNC_QT_DIR="$CONDA_PREFIX" CNC_OCC_DIR="$CONDA_PREFIX" bash scripts/build-viewer.sh

      - name: 'Смок (RESULT: OK)'
        shell: bash -el {0}
        run: |
          LANG=ru_RU.UTF-8 QT_QPA_PLATFORM=offscreen ./build/viewer/gcodeviewer --smoke | tee smoke.log
          grep -q 'RESULT: OK (parse-level)' smoke.log

      - name: 'Полный offscreen-прогон (segments: 70914)'
        shell: bash -el {0}
        run: |
          set +e
          LANG=ru_RU.UTF-8 QT_QPA_PLATFORM=offscreen ./build/viewer/gcodeviewer data/cad-testdata/Test_model.ngc > run.log 2>&1
          code=$?
          set -e
          cat run.log
          grep -q 'loaded g-code from: data/cad-testdata/Test_model.ngc segments: 70914' run.log
          grep -q 'offscreen mode - loaded OK.' run.log
          if grep -q '\[QML warning\]' run.log; then
            echo 'FAIL в прогоне есть [QML warning]'
            exit 1
          fi
          # The teardown crash is fixed (the controller destructor waits for the pool
          # task, viewer log 0.41.4): the run must end with 0.
          if [ "$code" -ne 0 ]; then
            echo "FAIL код выхода $code"
            exit 1
          fi
