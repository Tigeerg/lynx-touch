# environment.yml - the build and run environment of the 3D NC viewer on Linux
# (README.md, "Build and run the viewer (C++)").
#
# Creation:  conda env create -f environment.yml
#            conda activate gcode-cpp
# SDK directories by the same variable as in scripts/build-viewer.sh:
#            CNC_QT_DIR="$CONDA_PREFIX" CNC_OCC_DIR="$CONDA_PREFIX" bash scripts/build-viewer.sh
#
# The environment holds the compiler too (cxx-compiler), not just the SDK: the conda build of
# OCCT 8.0.1 links with the symbol __cxa_call_terminate@CXXABI_1.3.15 from libstdc++,
# which is absent in GCC 11 of the system Ubuntu 22.04, - the build with the system compiler
# fails at link time. The build runs with the compiler of the environment; when the compiler
# changes the build directory is cleaned (rm -rf build), CMake remembers the compiler in the cache.
#
# There is one channel - conda-forge: the service channels repo.anaconda.com are not needed and do not
# ask for their own terms of use. Qt is pinned to 6.12.0 (the documented
# version of the project; nothing lower than 6.7 is needed because of explicitTextureWidth/Height in
# GcodeViewer3D.qml), OCCT - to 8.0.1 (the version under which the reference
# digests oracle_manifest.json were taken: the probes verify tessellation and normals).
# There are no Python dependencies here: the viewer, its probes and checks are C++.
name: gcode-cpp
channels:
  - conda-forge
dependencies:
  - qt6-main=6.12.0
  - qt6-quick3d=6.12.0
  - occt=8.0.1
  - cxx-compiler
  - cmake
  - ninja
